<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notion 연결</title>
    <style>
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 16px;
        color: #111827;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        margin: 10px 0 6px;
        font-size: 12px;
        color: #374151;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 10px;
        font-size: 12px;
      }
      button {
        width: 100%;
        margin-top: 12px;
        border: 0;
        border-radius: 8px;
        padding: 10px;
        color: #fff;
        background: #2563eb;
        font-size: 12px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #6b7280;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Notion 페이지 불러오기</h1>
    <label for="token">Notion API Token</label>
    <input id="token" type="password" placeholder="secret_xxx..." />

    <label for="pageUrl">Notion Page URL</label>
    <input id="pageUrl" type="url" placeholder="https://www.notion.so/..." />

    <button id="loadBtn" type="button">내용 불러오기</button>
    <div id="status">토큰과 페이지 URL을 입력하세요.</div>

    <script>
      const BASE_URL = 'https://fignotion.vercel.app'
      const tokenInput = document.getElementById('token')
      const pageUrlInput = document.getElementById('pageUrl')
      const statusEl = document.getElementById('status')
      const loadBtn = document.getElementById('loadBtn')

      window.onmessage = (event) => {
        const msg = event.data && event.data.pluginMessage
        if (!msg || msg.type !== 'INIT') return
        if (msg.pageUrl) {
          pageUrlInput.value = msg.pageUrl
        }
      }

      loadBtn.addEventListener('click', async () => {
        const token = tokenInput.value.trim()
        const pageUrl = pageUrlInput.value.trim()

        if (!token) {
          setStatus('Notion API 토큰을 입력해주세요.')
          return
        }
        if (!pageUrl) {
          setStatus('Notion 페이지 URL을 입력해주세요.')
          return
        }

        const pageId = extractPageId(pageUrl)
        if (!pageId) {
          setStatus('유효한 Notion 페이지 URL이 아닙니다.')
          return
        }

        setStatus('Notion API 호출 중...')
        try {
          const response = await fetch(
            BASE_URL + '/api/notion?pageId=' + encodeURIComponent(pageId),
            {
              method: 'GET',
              headers: {
                Authorization: 'Bearer ' + token,
                'Content-Type': 'application/json'
              }
            }
          )

          if (!response.ok) {
            const errText = await response.text()
            throw new Error(`프록시 요청 실패 (${response.status}): ${errText}`)
          }

          const payload = await response.json()
          const data = payload.blocks || {}
          const pageData = payload.page || {}
          const pageTitle = extractPageTitle(pageData)
          const blocks = (data.results || [])
            .map(toRenderBlock)
            .filter((block) => block !== null)
          setStatus('불러오기 완료: ' + pageTitle)

          parent.postMessage(
            {
              pluginMessage: {
                type: 'NOTION_CONTENT',
                pageUrl,
                pageTitle,
                blocks
              }
            },
            '*'
          )
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          parent.postMessage(
            {
              pluginMessage: {
                type: 'NOTION_ERROR',
                message
              }
            },
            '*'
          )
        }
      })

      function setStatus(message) {
        statusEl.textContent = message
      }

      function toRenderBlock(block) {
        if (!block || !block.type) return null
        if (
          block.type !== 'heading_1' &&
          block.type !== 'heading_2' &&
          block.type !== 'heading_3' &&
          block.type !== 'paragraph' &&
          block.type !== 'bulleted_list_item' &&
          block.type !== 'numbered_list_item' &&
          block.type !== 'callout' &&
          block.type !== 'divider'
        ) {
          return null
        }
        if (block.type === 'divider') {
          return { type: block.type, text: '' }
        }
        const richText = block[block.type] && block[block.type].rich_text
        const text = Array.isArray(richText)
          ? richText.map((item) => item.plain_text || '').join('')
          : ''
        if (!text.trim()) return null
        return { type: block.type, text }
      }

      function extractPageId(url) {
        try {
          const parsed = new URL(url)
          const compact = parsed.pathname.replace(/-/g, '')
          const match = compact.match(/([0-9a-fA-F]{32})/)
          if (!match) return null
          return match[1]
        } catch (_error) {
          return null
        }
      }

      function extractPageTitle(page) {
        if (!page || typeof page !== 'object') return 'Untitled'
        const properties = page.properties || {}
        for (const key of Object.keys(properties)) {
          const property = properties[key]
          if (property && property.type === 'title' && Array.isArray(property.title)) {
            const text = property.title.map((item) => item.plain_text || '').join('')
            if (text.trim()) return text
          }
        }
        return 'Untitled'
      }
    </script>
  </body>
  </html>
